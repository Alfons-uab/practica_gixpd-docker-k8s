apiVersion: batch/v1
kind: Job

metadata:
  name: model-train

spec:
  template:
    spec:
      containers:
        - name: model-train
          image: model-train:v2
          imagePullPolicy: IfNotPresent

          env:
            - name: MODEL_PATH
              valueFrom:
                configMapKeyRef:
                  name: model-config
                  key: MODEL_PATH

          volumeMounts:
            - name: model-storage
              mountPath: /models

          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"

      volumes:
        - name: model-storage
          persistentVolumeClaim:
            claimName: model-pvc

      restartPolicy: Never

  backoffLimit: 1


